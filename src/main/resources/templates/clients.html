<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 클라이언트 관리 - Auth Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .section {
            margin-bottom: 40px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #667eea;
            outline: none;
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            width: auto;
        }
        .btn {
            display: inline-block;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            transition: background 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-info {
            background: #17a2b8;
            color: white;
        }
        .btn-info:hover {
            background: #138496;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .actions {
            display: flex;
            gap: 10px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #667eea;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .scope-badge {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 3px;
        }
        .error-text {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 10px;
            padding: 30px;
            width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .modal h2 {
            margin-bottom: 20px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← 홈으로</a>
        <h1>OAuth2 클라이언트 관리</h1>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <!-- 클라이언트 등록 폼 -->
        <div class="section">
            <h2>새 클라이언트 등록</h2>
            <form th:action="@{/clients/register}" th:object="${clientRequest}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientId">클라이언트 ID *</label>
                        <input type="text" id="clientId" th:field="*{clientId}" placeholder="my-application" required>
                        <div th:if="${#fields.hasErrors('clientId')}" class="error-text" th:errors="*{clientId}"></div>
                    </div>
                    <div class="form-group">
                        <label for="clientSecret">클라이언트 시크릿 *</label>
                        <input type="password" id="clientSecret" th:field="*{clientSecret}" placeholder="최소 8자" required>
                        <div th:if="${#fields.hasErrors('clientSecret')}" class="error-text" th:errors="*{clientSecret}"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="clientName">클라이언트 이름 *</label>
                    <input type="text" id="clientName" th:field="*{clientName}" placeholder="My Application" required>
                    <div th:if="${#fields.hasErrors('clientName')}" class="error-text" th:errors="*{clientName}"></div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="redirectUri">리다이렉트 URI *</label>
                        <input type="url" id="redirectUri" th:field="*{redirectUri}" placeholder="http://localhost:8080/callback" required>
                        <div th:if="${#fields.hasErrors('redirectUri')}" class="error-text" th:errors="*{redirectUri}"></div>
                    </div>
                    <div class="form-group">
                        <label for="postLogoutRedirectUri">로그아웃 후 리다이렉트 URI</label>
                        <input type="url" id="postLogoutRedirectUri" th:field="*{postLogoutRedirectUri}" placeholder="http://localhost:8080/">
                    </div>
                </div>

                <div class="form-group">
                    <label>Scopes (선택하지 않으면 기본값: openid, profile, email)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="scopes" value="openid" checked> openid</label>
                        <label><input type="checkbox" name="scopes" value="profile" checked> profile</label>
                        <label><input type="checkbox" name="scopes" value="email" checked> email</label>
                        <label><input type="checkbox" name="scopes" value="read"> read</label>
                        <label><input type="checkbox" name="scopes" value="write"> write</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Grant Types (선택하지 않으면 기본값: authorization_code, refresh_token)</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="grantTypes" value="authorization_code" checked> Authorization Code</label>
                        <label><input type="checkbox" name="grantTypes" value="refresh_token" checked> Refresh Token</label>
                        <label><input type="checkbox" name="grantTypes" value="client_credentials"> Client Credentials</label>
                        <label><input type="checkbox" name="grantTypes" value="password"> Password (Resource Owner)</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>설정</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="requireConsent" th:field="*{requireConsent}"> 동의 화면 필수</label>
                        <label><input type="checkbox" name="requireProofKey" th:field="*{requireProofKey}"> PKCE 필수 (SPA용)</label>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="accessTokenValiditySeconds">Access Token 유효 시간 (초)</label>
                        <input type="number" id="accessTokenValiditySeconds" th:field="*{accessTokenValiditySeconds}" value="3600">
                    </div>
                    <div class="form-group">
                        <label for="refreshTokenValiditySeconds">Refresh Token 유효 시간 (초)</label>
                        <input type="number" id="refreshTokenValiditySeconds" th:field="*{refreshTokenValiditySeconds}" value="604800">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">클라이언트 등록</button>
            </form>
        </div>

        <!-- 등록된 클라이언트 목록 -->
        <div class="section">
            <h2>등록된 클라이언트</h2>
            <table th:if="${clients != null and !clients.isEmpty()}">
                <thead>
                    <tr>
                        <th>클라이언트 ID</th>
                        <th>이름</th>
                        <th>Grant Types</th>
                        <th>Scopes</th>
                        <th>등록일</th>
                        <th>작업</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}">
                        <td th:text="${client.CLIENT_ID}">client-id</td>
                        <td th:text="${client.CLIENT_NAME}">Client Name</td>
                        <td th:text="${client.AUTHORIZATION_GRANT_TYPES}">authorization_code</td>
                        <td>
                            <span th:each="scope : ${#strings.arraySplit(client.SCOPES, ',')}"
                                  class="scope-badge" th:text="${scope}">scope</span>
                        </td>
                        <td th:text="${#temporals.format(client.CLIENT_ID_ISSUED_AT, 'yyyy-MM-dd HH:mm')}">2024-01-01</td>
                        <td class="actions">
                            <button type="button" class="btn btn-secondary"
                                    th:onclick="'openEditModal(\'' + ${client.CLIENT_ID} + '\')'">수정</button>
                            <a th:href="@{/clients/test/{clientId}(clientId=${client.CLIENT_ID})}" class="btn btn-info">테스트</a>
                            <form th:action="@{/clients/delete/{clientId}(clientId=${client.CLIENT_ID})}" method="post" style="display:inline"
                                  onsubmit="return confirm('정말 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-danger">삭제</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            <p th:if="${clients == null or clients.isEmpty()}" style="color: #666; text-align: center; padding: 40px;">
                등록된 클라이언트가 없습니다.
            </p>
        </div>

        <!-- 수정 모달 -->
        <div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeEditModal()">
            <div class="modal">
                <h2>클라이언트 수정</h2>
                <form id="editForm" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label>클라이언트 ID</label>
                            <input type="text" id="editClientId" readonly style="background:#e9ecef">
                        </div>
                        <div class="form-group">
                            <label>클라이언트 시크릿 (비워두면 기존 유지)</label>
                            <input type="password" name="clientSecret" id="editClientSecret" placeholder="변경 시 입력">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>클라이언트 이름 *</label>
                        <input type="text" name="clientName" id="editClientName" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>리다이렉트 URI *</label>
                            <input type="text" name="redirectUri" id="editRedirectUri" required>
                        </div>
                        <div class="form-group">
                            <label>로그아웃 후 리다이렉트 URI</label>
                            <input type="text" name="postLogoutRedirectUri" id="editPostLogoutRedirectUri">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Scopes</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="scopes" value="openid" id="editScopeOpenid"> openid</label>
                            <label><input type="checkbox" name="scopes" value="profile" id="editScopeProfile"> profile</label>
                            <label><input type="checkbox" name="scopes" value="email" id="editScopeEmail"> email</label>
                            <label><input type="checkbox" name="scopes" value="read" id="editScopeRead"> read</label>
                            <label><input type="checkbox" name="scopes" value="write" id="editScopeWrite"> write</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Grant Types</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="grantTypes" value="authorization_code" id="editGrantAuthCode"> Authorization Code</label>
                            <label><input type="checkbox" name="grantTypes" value="refresh_token" id="editGrantRefresh"> Refresh Token</label>
                            <label><input type="checkbox" name="grantTypes" value="client_credentials" id="editGrantClientCred"> Client Credentials</label>
                            <label><input type="checkbox" name="grantTypes" value="password" id="editGrantPassword"> Password</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>설정</label>
                        <div class="checkbox-group">
                            <label><input type="checkbox" name="requireConsent" id="editRequireConsent" value="true"> 동의 화면 필수</label>
                            <label><input type="checkbox" name="requireProofKey" id="editRequireProofKey" value="true"> PKCE 필수</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Access Token 유효 시간 (초)</label>
                            <input type="number" name="accessTokenValiditySeconds" id="editAccessTokenTTL" value="3600">
                        </div>
                        <div class="form-group">
                            <label>Refresh Token 유효 시간 (초)</label>
                            <input type="number" name="refreshTokenValiditySeconds" id="editRefreshTokenTTL" value="604800">
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" onclick="closeEditModal()">취소</button>
                        <button type="submit" class="btn btn-primary">저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
    function openEditModal(clientId) {
        fetch('/clients/edit/' + clientId)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                document.getElementById('editClientId').value = data.client_id || data.CLIENT_ID;
                document.getElementById('editClientName').value = data.client_name || data.CLIENT_NAME || '';
                document.getElementById('editClientSecret').value = '';

                var redirectUris = (data.redirect_uris || data.REDIRECT_URIS || '').split(',');
                document.getElementById('editRedirectUri').value = redirectUris[0] || '';

                var postLogoutUris = (data.post_logout_redirect_uris || data.POST_LOGOUT_REDIRECT_URIS || '').split(',');
                document.getElementById('editPostLogoutRedirectUri').value = postLogoutUris[0] || '';

                var scopes = (data.scopes || data.SCOPES || '').split(',');
                document.getElementById('editScopeOpenid').checked = scopes.indexOf('openid') >= 0;
                document.getElementById('editScopeProfile').checked = scopes.indexOf('profile') >= 0;
                document.getElementById('editScopeEmail').checked = scopes.indexOf('email') >= 0;
                document.getElementById('editScopeRead').checked = scopes.indexOf('read') >= 0;
                document.getElementById('editScopeWrite').checked = scopes.indexOf('write') >= 0;

                var grants = (data.authorization_grant_types || data.AUTHORIZATION_GRANT_TYPES || '').split(',');
                document.getElementById('editGrantAuthCode').checked = grants.indexOf('authorization_code') >= 0;
                document.getElementById('editGrantRefresh').checked = grants.indexOf('refresh_token') >= 0;
                document.getElementById('editGrantClientCred').checked = grants.indexOf('client_credentials') >= 0;
                document.getElementById('editGrantPassword').checked = grants.indexOf('password') >= 0;

                var settings = {};
                try { settings = JSON.parse(data.client_settings || data.CLIENT_SETTINGS || '{}'); } catch(e) {}
                var tokenSettings = {};
                try { tokenSettings = JSON.parse(data.token_settings || data.TOKEN_SETTINGS || '{}'); } catch(e) {}

                document.getElementById('editRequireConsent').checked =
                    settings['settings.client.require-authorization-consent'] === true;
                document.getElementById('editRequireProofKey').checked =
                    settings['settings.client.require-proof-key'] === true;

                var accessTTL = tokenSettings['settings.token.access-token-time-to-live'];
                if (accessTTL) {
                    var match = accessTTL.match(/PT(\d+(\.\d+)?)S/);
                    if (match) document.getElementById('editAccessTokenTTL').value = parseInt(match[1]);
                }
                var refreshTTL = tokenSettings['settings.token.refresh-token-time-to-live'];
                if (refreshTTL) {
                    var match2 = refreshTTL.match(/PT(\d+(\.\d+)?)S/);
                    if (match2) document.getElementById('editRefreshTokenTTL').value = parseInt(match2[1]);
                }

                document.getElementById('editForm').action = '/clients/update/' + (data.client_id || data.CLIENT_ID);
                document.getElementById('editModal').classList.add('active');
            })
            .catch(function(err) { alert('클라이언트 정보를 불러올 수 없습니다: ' + err); });
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }
    </script>
</body>
</html>
