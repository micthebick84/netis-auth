<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권한 동의 - Auth Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .consent-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 500px;
        }
        .consent-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .client-name {
            text-align: center;
            color: #667eea;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .scope-list {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .scope-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .scope-item:last-child {
            border-bottom: none;
        }
        .scope-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }
        .scope-item label {
            color: #333;
            font-size: 16px;
        }
        .scope-description {
            font-size: 14px;
            color: #666;
            margin-left: 30px;
        }
        .button-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .user-info {
            text-align: center;
            margin-bottom: 20px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="consent-container">
        <h1>권한 동의</h1>
        <p class="client-name" th:text="${clientName}">Application Name</p>

        <p class="user-info">
            <span th:text="${principalName}">username</span>님으로 로그인됨
        </p>

        <p class="description">
            위 애플리케이션이 다음 권한을 요청합니다:
        </p>

        <form th:action="@{/oauth2/authorize}" method="post">
            <input type="hidden" name="client_id" th:value="${clientId}">
            <input type="hidden" name="state" th:value="${state}">

            <div class="scope-list">
                <div th:each="scope : ${scopes}" class="scope-item">
                    <input type="checkbox" th:id="${scope}" name="scope" th:value="${scope}" checked>
                    <label th:for="${scope}" th:text="${scope}">scope</label>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-secondary" name="consent_action" value="cancel">
                    거부
                </button>
                <button type="submit" class="btn btn-primary" name="consent_action" value="approve">
                    동의
                </button>
            </div>
        </form>
    </div>
</body>
</html>
