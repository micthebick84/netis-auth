<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Auth Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-container h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .alert {
            padding: 12px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .oauth2-option {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #e1e1e1;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            color: #333;
        }
        .checkbox-label input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
        }
        .oauth2-settings {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e1e1e1;
        }
        .oauth2-settings label {
            display: block;
            margin-bottom: 5px;
            margin-top: 10px;
            color: #555;
            font-size: 14px;
        }
        .oauth2-settings select,
        .oauth2-settings input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .oauth2-settings select:focus,
        .oauth2-settings input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>로그인</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}">
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}">
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">사용자명</label>
                <input type="text" id="username" name="username" placeholder="사용자명을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <div class="form-group oauth2-option" style="display: none;">
                <label class="checkbox-label">
                    <input type="checkbox" id="oauth2_login" name="oauth2_login" value="true">
                    <span>OAuth2 Authorization Code 발급받기</span>
                </label>
                <div id="oauth2-settings" class="oauth2-settings" style="display: none;">
                    <label for="client_id">클라이언트</label>
                    <select id="client_id" name="client_id">
                        <option value="test-client">test-client</option>
                        <option value="spa-client">spa-client (PKCE)</option>
                    </select>
                    <label for="redirect_uri">Redirect URI</label>
                    <input type="text" id="redirect_uri" name="redirect_uri" value="http://localhost:8080/authorized">
                    <label for="scope">Scope</label>
                    <input type="text" id="scope" name="scope" value="openid profile email">
                </div>
            </div>

            <button type="submit" class="btn">로그인</button>
        </form>

        <script>
            document.getElementById('oauth2_login').addEventListener('change', function() {
                document.getElementById('oauth2-settings').style.display = this.checked ? 'block' : 'none';
            });
        </script>

        <div class="register-link">
            계정이 없으신가요? <a th:href="@{/register}">회원가입</a>
        </div>
    </div>
</body>
</html>
