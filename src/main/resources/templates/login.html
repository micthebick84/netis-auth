<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - NETIS</title>
    <!-- NETIS 디자인 시스템 로그인 (2026-10-11 디자인 승인 B안: 분할 히어로). 스타일은 /css/login.css -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="login-main">
    <section class="login-hero" aria-label="NETIS">
        <span class="login-hero__glow login-hero__glow--1" aria-hidden="true"></span>
        <span class="login-hero__glow login-hero__glow--2" aria-hidden="true"></span>
        <img class="login-hero__logo" th:src="@{/images/logo.png}" alt="NETIS">
        <div class="login-hero__foot">
            <p class="login-hero__tagline">Network Intelligent System</p>
            <div class="login-hero__chips">
                <span class="login-hero__chip">통합관제</span>
                <span class="login-hero__chip">운영관리</span>
            </div>
        </div>
    </section>

    <form class="login-card" th:action="@{/login}" method="post">
        <img class="login-card__logo" th:src="@{/images/logo-login.png}" alt="NETIS — Network Intelligent System">
        <h1 class="login-card__title">로그인</h1>

        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>

        <div class="login-fields">
            <div class="form-group">
                <label for="username">사용자명</label>
                <input type="text" id="username" name="username" placeholder="사용자명을 입력하세요." autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요." autocomplete="current-password" required>
            </div>
        </div>

        <!-- 개발용: OAuth2 Authorization Code 직접 발급 옵션 — 운영에서는 숨김 (CLAUDE.md 참고) -->
        <div class="form-group oauth2-option" style="display: none;">
            <label class="checkbox-label">
                <input type="checkbox" id="oauth2_login" name="oauth2_login" value="true">
                <span>OAuth2 Authorization Code 발급받기</span>
            </label>
            <div id="oauth2-settings" class="oauth2-settings" style="display: none;">
                <label for="client_id">클라이언트</label>
                <select id="client_id" name="client_id">
                    <option value="test-client">test-client</option>
                    <option value="spa-client">spa-client (PKCE)</option>
                </select>
                <label for="redirect_uri">Redirect URI</label>
                <input type="text" id="redirect_uri" name="redirect_uri" value="http://localhost:8080/authorized">
                <label for="scope">Scope</label>
                <input type="text" id="scope" name="scope" value="openid profile email">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">로그인</button>

        <p class="register-link" th:if="${registrationEnabled}">계정이 없으신가요? <a th:href="@{/register}">계정 신청</a></p>
    </form>
</main>

<script>
    document.getElementById('oauth2_login').addEventListener('change', function () {
        document.getElementById('oauth2-settings').style.display = this.checked ? 'block' : 'none';
    });
</script>
</body>
</html>
