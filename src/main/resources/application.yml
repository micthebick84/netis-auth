server:
  port: 9000

spring:
  application:
    name: auth-server
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: ntflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      # 공개 배포에서는 never 권장: data.sql이 기동마다 샘플 계정/클라이언트를 다시 넣음 (스키마가 이미 있을 때만 — 빈 DB 첫 기동에는 always)
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/postgres/schema.sql
      data-locations: classpath:db/postgres/data.sql
      continue-on-error: true

logging:
  level:
    # DEBUG/TRACE는 토큰·인가 코드가 로그에 남음. 공개 배포에서는 둘 다 INFO로.
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
    org.springframework.security.oauth2: ${SECURITY_LOG_LEVEL:DEBUG}
    org.springframework.security.oauth2.server.authorization: ${AUTHZ_LOG_LEVEL:TRACE}
    org.springframework.security.oauth2.server.authorization.oidc: ${AUTHZ_LOG_LEVEL:TRACE}

# Authorization Server issuer
authorization-server:
  issuer: ${AUTH_ISSUER_URI:http://localhost:9000}

# Application URLs (for OAuth2 client redirect URIs)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  # 계정 신청 허용 여부. false면 /register·/api/auth/register 차단 + 로그인 화면 "계정 신청" 링크 숨김.
  # true면 신청은 승인형(비활성 계정 → /admin/signups에서 승인). /oauth/register는 항상 차단.
  registration-enabled: ${REGISTRATION_ENABLED:true}
  registration:
    # 계정 신청 허용 이메일 도메인 (소문자 비교, "@도메인"으로 끝나야 함)
    allowed-email-domain: ${REGISTRATION_ALLOWED_EMAIL_DOMAIN:hamonsoft.co.kr}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://10.1.1.75:3000,http://10.1.1.75:8080}
